name: Firmware build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dispenser, dispenser-wokwi, beam-break, load-cell, motor-drv8833, motor-tb6612, ui-panel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pio run -e ${{ matrix.environment }}
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      # Unit tests + host simulation of lib/dispenser_core (no hardware).
      - run: pio test -e native -v
