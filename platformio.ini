[platformio]
default_envs = dispenser
src_dir = firmware

; Shared ESP32 settings. Every hardware environment extends this section.
[esp32]
platform = espressif32@6.9.0
board = featheresp32
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Integrated dispenser firmware (state machine in lib/dispenser_core).
[env:dispenser]
extends = esp32
build_src_filter = -<*> +<dispenser/>
lib_deps =
  bogde/HX711@0.7.5
  adafruit/Adafruit BusIO@1.16.2
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ILI9341@1.6.1
  adafruit/RTClib@2.1.4

; Same firmware with the motor, encoder and home switch replaced by the
; first-order motor model from lib/dispenser_core (for Wokwi / desk demos).
; Never flash this onto the real dispenser: it ignores the encoder.
[env:dispenser-wokwi]
extends = env:dispenser
build_flags = ${esp32.build_flags} -DDISPENSER_SIM_MOTOR

[env:beam-break]
extends = esp32
build_src_filter = -<*> +<component-tests/beam_break/>

[env:load-cell]
extends = esp32
build_src_filter = -<*> +<component-tests/load_cell/>
lib_deps = bogde/HX711@0.7.5

[env:motor-drv8833]
extends = esp32
build_src_filter = -<*> +<component-tests/motor/>
build_flags = -DCOMPONENT_MOTOR -DMOTOR_DRIVER_DRV8833
monitor_speed = 9600

[env:motor-tb6612]
extends = esp32
build_src_filter = -<*> +<component-tests/motor/>
build_flags = -DCOMPONENT_MOTOR -DMOTOR_DRIVER_TB6612
monitor_speed = 9600

; Host-side unit tests and simulation of lib/dispenser_core (no Arduino).
; Run with: pio test -e native
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
lib_compat_mode = off
build_flags = -std=gnu++17 -Wall -Wextra -DDISPENSER_NATIVE -DUNITY_INCLUDE_DOUBLE
build_src_filter = -<*>
