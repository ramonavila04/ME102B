[platformio]
default_envs = dispenser
src_dir = firmware

[env]
platform = espressif32@6.9.0
board = featheresp32
framework = arduino
monitor_speed = 115200

[env:dispenser]
build_src_filter = -<*> +<dispenser/>

[env:beam-break]
build_src_filter = -<*> +<component-tests/beam_break/>

[env:load-cell]
build_src_filter = -<*> +<component-tests/load_cell/>
lib_deps = bogde/HX711@0.7.5

[env:motor-drv8833]
build_src_filter = -<*> +<component-tests/motor/>
build_flags = -DCOMPONENT_MOTOR -DMOTOR_DRIVER_DRV8833
monitor_speed = 9600

[env:motor-tb6612]
build_src_filter = -<*> +<component-tests/motor/>
build_flags = -DCOMPONENT_MOTOR -DMOTOR_DRIVER_TB6612
monitor_speed = 9600
